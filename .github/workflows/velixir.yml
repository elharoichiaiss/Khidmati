name: Deploy to velixir

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Velixir via API
        run: |
          curl -X POST \
            -H "X-Api-Key: ${{ secrets.VELIXIR_API_KEY }}" \
            -H "Content-Type: application/json" \
            https://api.velixir.net/v1/apps
