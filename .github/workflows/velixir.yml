name: Deploy to velixir

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Velixir CLI and Deploy
        run: |
          curl -fsSL https://velixir.net/install.sh | sh
          echo "$HOME/.velixir/bin" >> $GITHUB_PATH
          $HOME/.velixir/bin/velixir deploy --app a906126a-6554-4782-8f25-cc5f8a3b5332
        env:
          VELIXIR_API_KEY: ${{ secrets.VELIXIR_API_KEY }}
